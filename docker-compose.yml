version: '3.8'

services:
  db:
    image: mariadb:latest
    restart: always
    environment:
      - MARIADB_DATABASE=web
      - MARIADB_ROOT_PASSWORD=qwer1234
    ports:
      - "3306:3306"
    volumes:
      - ./db:/var/lib/mysql

  api-user:
    image: ddarahakit2026/fullstack-api-user
    ports:
      - "8081:8080"
    environment:
      - DB_URL=jdbc:mariadb://db:3306/web
      - DB_USER=root
      - DB_PASS=qwer1234
    depends_on:
      - db
  api-post:
    image: ddarahakit2026/fullstack-api-post
    ports:
      - "8082:8080"
    environment:
      - DB_URL=jdbc:mariadb://db:3306/web
      - DB_USER=root
      - DB_PASS=qwer1234
    depends_on:
      - db